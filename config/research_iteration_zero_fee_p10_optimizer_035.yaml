candidate_search:
  random_seed: 35
  max_candidates: 300
  exact_top_n: 30
  search_entry_stride_bars: 24
  max_sample_positions_per_candidate: 24
  base_size_safety: 0.95
  cooldown_hours: [6, 12, 18, 24, 36]
  rsi_threshold_pairs:
    - [35, 65]
    - [32, 68]
    - [30, 70]
    - [28, 72]
  max_grids_per_month: [8, 12, 15, 20, 25]
  blackout_hours: [24, 48]
  min_severity: [4, 5]
  trend_propagation_bars: [36, 48, 72]
  breakout_atr_buffer: [0.25, 0.35, 0.5]
  min_range_expansion_ratio: [1.3, 1.5, 1.8]
  spacing_atr_multipliers: [4.5, 6, 7.5, 9]
  take_profit_spacing_multipliers: [4, 6, 8, 10, 12]
  max_levels: [2, 3, 4]
  progression_multipliers: [1.15, 1.25, 1.35, 1.45]
  max_notional_caps: [10, 15, 20, 25, 30]
  max_holding_hours: [6, 9, 12]
  pause_after_forced_loss_hours: [12, 24, 48]
  rolling_7d_loss_thresholds: [-0.03, -0.05, -0.08]

selection:
  min_grids_per_month: 8
  max_orders_per_month: 120
  max_drawdown: -0.35
  require_net_pnl_per_order_positive: true
  uses_drawdown: false

validation:
  cpcv_blocks: 5
  cpcv_test_blocks: 2
  cpcv_purge_adjacent_blocks: true
  monte_carlo_iterations: 2000
  monte_carlo_seed: 35035
  robust_monthly_p10_min: 0.0
  holdout_min_total_return: 0.0
  cpcv_p25_min: 0.0
  mc_p05_min: 0.0
  positive_probability_min: 0.95
  ruin_probability_max: 0.0
  overfitting_protocol:
    reference: ssrn-4686376
    require_walk_forward: true
    require_cpcv: true
    require_pbo: true
    require_dsr: true
    cpcv_n_splits: 8
    cpcv_n_test_groups: 2
    cpcv_embargo_pct: 0.02
    cscv_partitions: 16
    max_pbo: 0.10
    min_dsr_statistic: 0.0
    min_cpcv_p25: 0.0

fundamental_blackout:
  enabled: true
  use_default_seed: true
  events_path:
  pre_event_hours: 24
  post_event_hours: 24
  surprise_reaction_hours: 48
  oracle_pre_event_hours: 24
  min_severity: 4
  categories:
    - macro_fomc
    - macro_cpi
    - macro_jobs
    - macro_ppi
    - crypto_regulatory
    - exchange_hack
    - stablecoin_depeg
    - etf_news
    - major_liquidation
    - halving

trend_escape:
  range_lookback_bars: 48
  breakout_atr_buffer: 0.25
  confirmation_bars: 2
  min_confirmations: 1
  delay_bars: 1
  propagation_bars: 36
  require_compression: false
  min_abs_trend_alignment: 0.75
  min_range_expansion_ratio: 1.30
  min_realized_volatility_ratio: 1.30
  include_existing_breakout_risk: false
