services:
  collector-btcusdt-depth:
    build: .
    image: grid-survival-research:latest
    container_name: grid-survival-collector-btcusdt-depth
    restart: unless-stopped
    command:
      - python
      - -m
      - src.infra.binance_microstructure_collector
      - --run
      - --config
      - config/infrastructure_microstructure.yaml
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - src.infra.binance_microstructure_collector
        - --healthcheck
        - --config
        - config/infrastructure_microstructure.yaml
        - --max-age-seconds
        - "20"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  collector-btcusdt-klines:
    build: .
    image: grid-survival-research:latest
    container_name: grid-survival-collector-btcusdt-klines
    restart: unless-stopped
    command:
      - python
      - -m
      - src.infra.binance_kline_collector
      - --run
      - --config
      - config/shadow_live_037.yaml
      - --timeframe
      - 5m
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - src.infra.binance_kline_collector
        - --healthcheck
        - --config
        - config/shadow_live_037.yaml
        - --timeframe
        - 5m
        - --max-age-minutes
        - "15"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  research-runner:
    build: .
    image: grid-survival-research:latest
    profiles: ["manual"]
    command:
      - python
      - -m
      - src.research.microstructure_order_policy_017
      - --evaluate-policies
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./reports:/app/reports

  ops-monitor:
    build: .
    image: grid-survival-research:latest
    profiles: ["manual"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    command:
      - python
      - -m
      - src.infra.ops_monitor
      - --healthcheck
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./reports:/app/reports

  daily-evaluation:
    build: .
    image: grid-survival-research:latest
    profiles: ["manual"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    command:
      - python
      - -m
      - src.research.rolling_execution_evaluation
      - --days
      - "7"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./reports:/app/reports

  quality-dashboard:
    build: .
    image: grid-survival-research:latest
    profiles: ["manual"]
    command:
      - python
      - -m
      - src.infra.microstructure_quality_report
      - --days
      - "7"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./reports:/app/reports

  paper-runner:
    build: .
    image: grid-survival-research:latest
    profiles: ["manual"]
    environment:
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
    command:
      - python
      - -m
      - src.paper.paper_trading_harness
      - --run-once
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./reports:/app/reports

  shadow-runner-037:
    build: .
    image: grid-survival-research:latest
    profiles: ["manual"]
    environment:
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
    command:
      - python
      - -m
      - src.paper.shadow_live_037
      - --run-once
      - --config
      - config/shadow_live_037.yaml
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./reports:/app/reports
      - ./research_evidence:/app/research_evidence:ro

  report-server:
    build: .
    image: grid-survival-research:latest
    profiles: ["manual"]
    command:
      - python
      - -m
      - http.server
      - "8000"
      - --directory
      - reports
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports:ro
